        expression: product_name
    datatype: String
    dimension: {}
  - name: category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: category
    datatype: String
    dimension: {}
  - name: loaded_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: loaded_at
    datatype: DateTime
    dimension:
      is_time: true
  primary_key:
  - id
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "computed_primary_key": ["id"], "cube_extras": {"data_source":
