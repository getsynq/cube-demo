metrics:
- name: customers__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT customers.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "drill_members": ["id", "full_name", "region"], "name": "count"}'
- name: region_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT customers.REGION)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Regions with customers"}'
- name: events__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT events.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: purchase_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(events.AMOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: signup_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (events.EVENT_NAME = 'signup') THEN events.id
        END)
  datatype: Integer
- name: login_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (events.EVENT_NAME = 'login') THEN events.id
        END)
  datatype: Integer
- name: purchase_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (events.EVENT_NAME = 'purchase') THEN events.id
        END)
  datatype: Integer
- name: signup_to_purchase_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 1.0 * purchase_count / NULLIF(signup_count, 0)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "percent"}'
- name: order_items__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT order_items.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: quantity_sold
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(order_items.QUANTITY)
- name: gross_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(order_items.QUANTITY * order_items.UNIT_PRICE)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: discount_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(order_items.DISCOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: net_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: gross_amount - discount_amount
  description: Gross amount minus discounts
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: discounted_items
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (order_items.DISCOUNT > 0) THEN order_items.id
        END)
  datatype: Integer
- name: products_sold
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT order_items.PRODUCT_ID)
  datatype: Integer
- name: products_sold_approx
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: APPROX_COUNT_DISTINCT(order_items.PRODUCT_ID)
  datatype: Integer
- name: avg_unit_price
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(order_items.UNIT_PRICE)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: orders__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT orders.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "drill_members": ["id", "status", "amount", "ordered_at"], "name":
      "count"}'
- name: customer_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT orders.CUSTOMER_ID)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Customers with orders"}'
- name: orders__revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(orders.AMOUNT)
  description: Sum of the order amounts
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "name": "revenue"}'
- name: avg_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(orders.AMOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: min_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MIN(orders.AMOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: max_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MAX(orders.AMOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: average_order_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: orders__revenue / NULLIF(orders__count, 0)
  description: Revenue divided by the number of orders
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: first_order_at
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MIN(orders.ORDERED_AT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "type": "time"}'
- name: has_returns
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: BOOLOR_AGG(orders.STATUS = 'returned')
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "type": "boolean"}'
- name: statuses_seen
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: LISTAGG(DISTINCT orders.STATUS, ', ')
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "type": "string"}'
- name: new_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS = 'new') THEN orders.id
        END)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "New orders", "meta": {"generated_by": "status_measures",
      "status": "new"}}'
- name: new_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS = 'new') THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "title": "New revenue", "meta": {"generated_by":
      "status_measures", "status": "new"}}'
- name: paid_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS = 'paid') THEN orders.id
        END)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Paid orders", "meta": {"generated_by": "status_measures",
      "status": "paid"}}'
- name: paid_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS = 'paid') THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "title": "Paid revenue", "meta": {"generated_by":
      "status_measures", "status": "paid"}}'
- name: shipped_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS = 'shipped') THEN orders.id
        END)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Shipped orders", "meta": {"generated_by": "status_measures",
      "status": "shipped"}}'
- name: shipped_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS = 'shipped') THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "title": "Shipped revenue", "meta": {"generated_by":
      "status_measures", "status": "shipped"}}'
- name: delivered_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS = 'delivered') THEN orders.id
        END)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Delivered orders", "meta": {"generated_by": "status_measures",
      "status": "delivered"}}'
- name: delivered_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS = 'delivered') THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "title": "Delivered revenue", "meta": {"generated_by":
      "status_measures", "status": "delivered"}}'
- name: returned_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS = 'returned') THEN orders.id
        END)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Returned orders", "meta": {"generated_by": "status_measures",
      "status": "returned"}}'
- name: returned_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS = 'returned') THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "title": "Returned revenue", "meta": {"generated_by":
      "status_measures", "status": "returned"}}'
- name: completed_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (orders.STATUS IN ('shipped', 'delivered'))
        THEN orders.id END)
  datatype: Integer
- name: high_value_completed_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (orders.STATUS IN ('shipped', 'delivered')) AND (orders.AMOUNT
        >= 1000) THEN orders.AMOUNT END)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: return_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 1.0 * returned_count / NULLIF(orders__count, 0)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "percent"}'
- name: revenue_thousands
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: orders__revenue / 1000
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "public": false}'
- name: debug_row_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT orders.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "public": false, "meta": {"environment": "default"}}'
- name: pg_orders__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT pg_orders.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: pg_orders__revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(pg_orders.amount)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency", "name": "revenue"}'
- name: p90_amount
