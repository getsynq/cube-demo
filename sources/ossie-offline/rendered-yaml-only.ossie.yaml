- name: bq_events
  source: |-
    SELECT
      event_id,
      event_ts,
      event_name,
      JSON_VALUE(payload, '$.plan') AS plan,
      SAFE_CAST(JSON_VALUE(payload, '$.amount') AS NUMERIC) AS amount
    FROM synq_dwhtesting.events_hourly
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_id
    datatype: String
    dimension: {}
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_name
    datatype: String
    dimension: {}
  - name: plan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: plan
    datatype: String
    dimension: {}
  - name: event_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_ts
    datatype: DateTime
    dimension:
      is_time: true
  primary_key:
  - id
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "computed_primary_key": ["id"], "cube_extras": {"data_source":
      "bigquery", "title": "Events (BigQuery)"}}'
- name: products
  source: DWH_TESTING.SCHEMA_A.PRODUCTS
  description: Product catalog with inventory tracking
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ID
    datatype: Decimal
    dimension: {}
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: NAME
    datatype: String
    dimension: {}
    description: Product display name
  - name: category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CATEGORY
    datatype: String
    dimension: {}
  - name: sku
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TRIM(SKU)
    datatype: String
    dimension: {}
    label: SKU
  - name: is_active
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: IS_ACTIVE
    datatype: Boolean
    dimension: {}
  - name: price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PRICE
    datatype: Decimal
    dimension: {}
    custom_extensions:
    - vendor_name: CUBE
      data: '{"_v": 1, "format": "currency"}'
  - name: price_band
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: |
          CASE
            WHEN PRICE < 10 THEN 'budget'
            WHEN PRICE < 30 THEN 'standard'
            ELSE 'premium'
          END
    datatype: String
    dimension: {}
  - name: created_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CREATED_AT
    datatype: DateTime
    dimension:
      is_time: true
  - name: product_page
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: '''https://example.com/products/'' || ID'
    datatype: String
    dimension: {}
    custom_extensions:
    - vendor_name: CUBE
      data: '{"_v": 1, "format": "link"}'
  - name: ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ID
    datatype: Decimal
    custom_extensions:
    - vendor_name: CUBE
      data: '{"_v": 1, "key_only": true}'
