      expression: PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY pg_orders.amount)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: ch_order_item_facts__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT ch_order_item_facts.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: line_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(ch_order_item_facts.line_amount)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: orders
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT ch_order_item_facts.order_id)
  datatype: Integer
- name: orders_approx
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: APPROX_COUNT_DISTINCT(ch_order_item_facts.order_id)
  datatype: Integer
- name: bq_events__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT bq_events.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(bq_events.amount)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: products__count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT products.id)
  datatype: Integer
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "name": "count"}'
- name: active_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN (products.IS_ACTIVE) THEN products.id END)
  datatype: Integer
- name: avg_price
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(products.PRICE)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: min_price
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MIN(products.PRICE)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: max_price
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MAX(products.PRICE)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: stock_quantity
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(products.QUANTITY)
- name: stock_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(products.PRICE * products.QUANTITY)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "currency"}'
- name: active_ratio
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 1.0 * active_count / NULLIF(products__count, 0)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "format": "percent"}'
- name: snapshot_stock_quantity
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(product_snapshots.QUANTITY)
- name: score
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(scorecard_base.AMOUNT)
  custom_extensions:
  - vendor_name: CUBE
    data: '{"_v": 1, "title": "Score"}'
custom_extensions:
- vendor_name: CUBE
  data: '{"_v": 1, "views": {"customer_360": {"name": "customer_360", "title": "Customer
    360", "description": "Customers with their order history", "meta": {"owner": "sales-analytics"},
    "cubes": [{"join_path": "customers", "includes": ["id", "full_name", "region",
    "lifetime_revenue", "lifetime_tier", "count", "emea", "geography"]}, {"join_path":
    "customers.orders", "prefix": true, "includes": ["count", "revenue", "first_order_at",
    "new_count", "paid_count", "shipped_count", "delivered_count", "returned_count"]}]},
    "events_internal": {"name": "events_internal", "public": false, "description":
    "A hidden view for the product team", "cubes": [{"join_path": "events", "includes":
    "*"}]}, "order_items_detail": {"name": "order_items_detail", "title": "Order items",
    "description": "Order lines with the product and the status of the order", "cubes":
    [{"join_path": "order_items", "includes": ["count", "quantity_sold", "gross_amount",
    "discount_amount", "net_amount", "has_discount"]}, {"join_path": "order_items.products",
    "includes": [{"name": "name", "alias": "product", "title": "Product"}, {"name":
    "category", "alias": "product_category"}, "is_active", "catalog"]}, {"join_path":
    "order_items.orders", "prefix": true, "includes": ["status", "ordered_at"]}],
    "measures": [{"name": "discount_share", "multi_stage": true, "sql": "{CUBE.discount_amount}
    / NULLIF({CUBE.gross_amount}, 0)", "type": "number", "format": "percent"}], "dimensions":
    [{"name": "product_label", "sql": "{CUBE.product_category} || '' / '' || {CUBE.product}",
    "type": "string"}], "default_filters": [{"member": "is_active", "operator": "equals",
    "values": ["true"], "unless": ["is_active"]}]}, "orders_overview": {"name": "orders_overview",
    "title": "Orders overview", "description": "Orders with the customer and the fiscal
