services:
  cube:
    image: cubejs/cube:v1.8.30
    ports:
      - "4000:4000" # REST API, Playground
      - "15432:15432" # SQL API
    env_file: .env
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DATASOURCES: default,postgres,clickhouse,bigquery
      # Multi-stage measures, calendar cubes and switch dimensions need the Tesseract planner.
      CUBEJS_TESSERACT_SQL_PLANNER: "true"
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: cube
      CUBEJS_SQL_PASSWORD: cube
      # Pre-aggregations are defined, but nothing builds them unless a query asks.
      CUBEJS_SCHEDULED_REFRESH_DEFAULT: "false"
      CUBEJS_TELEMETRY: "false"
    volumes:
      - .:/cube/conf
      - ./.secrets:/cube/secrets:ro
